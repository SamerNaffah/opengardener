[package]
name = "gardener"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gardener"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["rt"] }
tonic              = "0.12"
prost              = "0.13"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
uuid               = { version = "1", features = ["v4"] }
chrono             = { version = "0.4", features = ["serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-stream       = "0.1"
axum               = "0.7"
tower              = "0.4"

[build-dependencies]
tonic-build = "0.12"

# Tuned release profile for the orchestrator binary:
#  - LTO compresses the hot path across crate boundaries (10-30% improvement on
#    pure-Rust workloads we saw at the soil/gRPC layer).
#  - codegen-units=1 lets the linker inline aggressively (slower compile, faster run).
#  - panic=abort cuts ~5-10% binary size and avoids unwinding cost; we don't
#    catch_unwind anywhere.
#  - strip=symbols shrinks the runtime image significantly.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
debug         = false

# Slimmer dev profile for faster iteration; keep debuginfo line-only.
[profile.dev]
opt-level    = 0
debug        = "line-tables-only"
incremental  = true

# Optimised tests so cargo test isn't measuring debug-mode performance.
[profile.test]
opt-level = 1
debug     = "line-tables-only"
